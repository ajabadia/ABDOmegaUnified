name: Verificación

# =============================================================================
# POR QUÉ ESTE FICHERO EXISTE
# =============================================================================
# Antes de esto, el proyecto no tenía NADA de integración continua: las pruebas
# se ejecutaban solo cuando alguien se acordaba, en su máquina, en Windows. De
# ahí que durante años hubiera pruebas rotas que nadie sabía (los 20 tests en
# rojo que aparecieron al ejecutar los specs enteros) y atajos que anunciaban
# algo que no hacia nada.
#
# Este workflow corre en cada cambio y es la puerta que se cierra sola.
#
# ALCANCE DELIMITADO A PROPÓSITO
# ------------------------------
# Cubre lo que está MEDIDO que funciona hoy. Deja fuera, a propósito:
#   - Los guards de `.bat`/`.cmd`: solo tienen sentido con cmd.exe.
#   - El motor de audio en navegador (rack.worklet + WASM): necesita compilar
#     los `.wasm` con Emscripten, que no está en el runner.
# Lo que sí queda fuera de la puerta y no dentro: ver "PENDIENTE" al final.
#
# IMPORTANTÍSIMO sobre `prepare_public_assets.mjs --check`
# -------------------------------------------------------
# Ese script NO se usa como puerta aquí, y es deliberado: pregunta "¿están los
# assets disponibles AHORA?", y en un runner de Linux los junctions de Windows
# no existen, así que fallaría siempre. Lo que de verdad importa es comprobar
# el estado DESPUÉS de compilar, que es el paso `prebuild`. Eso es lo que hace
# el job `verify` al final.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Dos pushes seguidos a main: el segundo invalida el primero. Sin esto, cada
# commit encolaría 30 minutos de runner para un resultado que ya no importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # PUERTA RÁPIDA — tipos, pruebas unitarias y compilación. ~5 minutos.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Guard de la raíz: falla si un literal canónico ('industrial', 1, 12…)
      # reaparece fuera de su DEFAULT_*. Está pensado para esto —cover builds
      # que NO corren tests— y en un runner siempre es un build así.
      - name: Guard de defaults canónicos
        run: node ../scripts/check_canonical_defaults.mjs

      - name: Tipos
        run: npx tsc --noEmit

      # POR QUÉ NO ES UN `npx jest` A SECO
      # ---------------------------------------
      # Los logs de GitHub exigen iniciar sesión para leerlos (la API pública
      # devuelve 403), así que un job rojo puede ser un misterio: se sabe que
      # falló, pero no por qué. Este paso convierte el fallo en ANOTACIONES,
      # que sí son datos abiertos y se leen sin cuenta.
      - name: Pruebas unitarias
        run: |
          set +e
          npx jest src/lib src/features/manifest-editor src/services/history.test.ts src/omega-ui-core \
            app/api/modules scripts/__tests__/check-api-modules-trace \
            --json --outputFile=../jest-report.json > ../jest-output.txt 2>&1
          status=$?
          node ../scripts/report_jest_failures.cjs ../jest-report.json
          if [ $status -ne 0 ]; then
            echo "::group::Últimas líneas de la salida de Jest"
            tail -n 40 ../jest-output.txt
            echo "::endgroup::"
          fi
          exit $status

      # Esto ejecuta `prebuild` (scripts/prepare_public_assets.mjs), que es la
      # primera prueba real del script en Linux: en el runner no hay junctions,
      # así que tiene que reconstruir public/ desde las rutas canónicas. Si eso
      # se rompe, este paso falla —que es justo lo que queremos.
      - name: Compilar para producción
        run: npm run build

      # La razón de ser de este workflow, en dos líneas: que un despliegue no
      # pueda salir sin módulos de sonido ni sin el editor de texto. Los
      # junctions de la máquina de desarrollo no existen aquí, así que si el
      # `prebuild` no hizo su trabajo, estos ficheros no están y esto falla.
      - name: Comprobar que public/ se materializó
        run: |
          set -euo pipefail
          test -f public/modules/vco/vco.acemm   || { echo "::error::Falta public/modules (el catálogo de módulos)"; exit 1; }
          test -f public/monaco/vs/loader.js     || { echo "::error::Falta public/monaco (el editor de código)"; exit 1; }
          test -f public/worklets/rack.worklet.js || { echo "::error::Falta public/worklets/rack.worklet.js"; exit 1; }
          echo "public/ materializado correctamente"

      # El peso de la lambda de /api/modules, medido sobre la traza que Turbopack
      # acaba de escribir. Tiene que ir DESPUÉS del build, no antes.
      #
      # POR QUÉ hace falta: el aviso "the whole project was traced unintentionally"
      # es cualitativo; Vercel corta a 250 MB por función sin comprimir y con eso
      # el despliegue se queda en ERROR. MEDIDO el 4 de octubre de 2026: 3827
      # ficheros / 294.07 MB trazados (la lambda de 264.38 MB), frente a 96
      # ficheros / 1.59 MB con las anotaciones `turbopackIgnore` ya puestas.
      # Los tests de Jest no pueden cubrir esto: la traza solo existe tras
      # `next build`, así que la puerta va aquí y no en la suite.
      - name: Peso de la lambda api/modules
        run: node scripts/check-api-modules-trace.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # PUERTA DE NAVEGADOR — ~30 minutos.
  # ───────────────────────────────────────────────────────────────────────────
  browser:
    name: Pruebas en navegador real
    runs-on: ubuntu-latest
    timeout-minutes: 55

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Los tests necesitan los assets de public/ (el editor de código sale de
      # ahí, y sin internet el CDN no responde). El `prebuild` los deja.
      - name: Preparar los assets de public/
        run: npm run prebuild

      # El cache va ANTES de instalar: si va después, no restaura nada y solo
      # vuelve a subir lo que acaba de descargar (~150 MB por ejecución).
      - name: Cachear los navegadores de Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # ─────────────────────────────────────────────────────────────────────
      # PASO 1 — LA PUERTA. Los specs que están verdes hoy (medido el
      # 3 de octubre de 2026). Si uno de estos se rompe, el cambio no entra.
      #
      # `smoke-tests` entra aunque tenga 2 tests marcados `fixme`: esos no
      # fallan nunca, se saltan a propósito y con su motivo escrito.
      #
      # POR QUÉ YA NO HAY UN PASO 2
      # ---------------------------
      # El job tenía dos pasos: este, que bloquea, y un paso informativo con
      # `continue-on-error` para `rack-features` y `toolbar`, que estaban en
      # rojo. Ese segundo paso ya no existe: los dos specs están verdes y
      # bloquean.
      #
      # Arreglarlos destapó TRES fallos reales de la aplicación que los tests
      # llevaban tiempo cubriendo sinAssertarlos:
      #
      #   - `numeric-resize` y `numeric-rotate` no figuraban en
      #     TOOLBAR_BUTTONS, así que nunca entraban en el orden por defecto y
      #     sus botones eran inalcanzables. Tenían popover, atajo de teclado y
      #     entrada de menú; solo faltaban en una lista.
      #   - El asistente de "rack vacío" decidía con `tree.children.length > 0`.
      #     Inyectar un blueprint deja un `container`, así que al borrar la
      #     celda el rack quedaba en blanco y el asistente no volvía nunca.
      #   - `toolbar.spec.ts` pedía un panel de Properties que el botón de
      #     Config nunca abrió (abre el modal de preferencias) y buscaba
      #     `.uca-port`, una clase que `CellNode` no emite nunca.
      #
      # La lección repetida de este workflow: un test en rojo "conocido" no es
      # una deuda, es un fallo de la aplicación que nadie miró.
      # ─────────────────────────────────────────────────────────────────────
      - name: Specs en verde (puerta)
        run: >-
          npx playwright test
          e2e/accessibility.spec.ts
          e2e/blueprint-injection.spec.ts
          e2e/blueprint-store.spec.ts
          e2e/bulk-upload-validation.spec.ts
          e2e/command-palette.spec.ts
          e2e/connection-editor.spec.ts
          e2e/distilled-json-import.spec.ts
          e2e/i18n-routing.spec.ts
          e2e/layers-panel-filters.spec.ts
          e2e/mini-map-visual.spec.ts
          e2e/omega-project.spec.ts
          e2e/rack-features.spec.ts
          e2e/shortcuts.spec.ts
          e2e/smoke-tests.spec.ts
          e2e/toolbar.spec.ts
          --reporter=line
